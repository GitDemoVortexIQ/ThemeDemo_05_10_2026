<h2 class="page-heading">{{lang 'products.new' }}</h2>

<ul class="productGrid productGrid--maxCol{{ columns }}" id="newproducts-slider"
    data-slick='{
        "arrows": false,
        "dots": true,
        "mobileFirst": true,
        "slidesToShow": 2,
        "slidesToScroll": 1,
        "infinite": true,
        "autoplay": false,
        "lazyLoad":"anticipated",
        "slide": ".new-product-slide",
        "responsive": [
            {
                "breakpoint": 1280,
                "settings": {
                    "slidesToShow": 5,
                    "slidesToScroll": 1,
                    "dots": false
                }
            },
            {
                "breakpoint": 1000,
                "settings": {
                    "slidesToShow": 4,
                    "slidesToScroll": 1
                }
            },
            {
                "breakpoint": 600,
                "settings": {
                    "slidesToShow": 3,
                    "slidesToScroll": 1
                }
            },
            {
                "breakpoint": 468,
                "settings": {
                    "slidesToShow": 2,
                    "slidesToScroll": 1
                }
            }
        ]
    }'
>
    {{#each products}}
        <li class="product new-product-slide">
            {{>components/products/card settings=../settings theme_settings=../theme_settings customer=../customer show_rating=../settings.show_product_rating}}
        </li>
    {{/each}}
</ul>
