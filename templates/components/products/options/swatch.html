<div class="form-field" data-product-attribute="swatch" role="radiogroup" aria-labelledby="swatchGroup_{{id}}">
    <label class="form-label form-label--alternate form-label--inlineSmall" id="swatchGroup_{{id}}">
        {{this.display_name}}
        <!--<span data-option-value></span>-->

        {{> components/common/requireness-msg}}
    </label>
    <span
        class="swatch-option-message aria-description--hidden u-hidden">
        {{ lang 'products.swatch_option_announcement' swatch_name=this.display_name}}
    </span>
    <div class="swatches-wrapper">
        {{#if this.values.length '>' 5}}
            <span class="arrow left-arrow" id="left-arrow-{{id}}">&#8249;</span>
        {{/if}}
        <div class="swatches-container" id="swatch-container-{{id}}" style="display: flex; align-items: start;">
        {{#unless required}}
            <input
                class="form-radio"
                type="radio"
                name="attribute[{{id}}]"
                value=""
                id="attribute_swatch_{{id}}_none"
                checked="{{#if defaultValue '==' ''}}checked{{/if}}"
                aria-label="{{lang 'products.none'}}"
            >
            <label class="form-option form-option-swatch" for="attribute_swatch_{{id}}_none">
                <span class='form-option-variant form-option-variant--none' title="{{lang 'products.none'}}">{{lang 'products.none'}}</span>
            </label>
        {{/unless}}

        {{#each this.values}}
        <div class="form-option-wrapper">
            <input class="form-radio"
                type="radio"
                name="attribute[{{../id}}]"
                value="{{id}}"
                id="attribute_swatch_{{../id}}_{{id}}"
                {{#if selected}}checked data-default{{/if}}
                {{#if ../required}}required{{/if}}
                aria-label="{{this.label}}"
            >
            <label class="form-option form-option-swatch" for="attribute_swatch_{{../id}}_{{id}}" data-product-attribute-value="{{id}}">
                {{#if image}}
                    <span class='form-option-variant form-option-variant--pattern' title="{{this.label}}" style="background-image: url('{{getImage image "swatch_option_size"}}');"></span>
                {{/if}}
                {{#if data.[2]}}
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[1]}}"></span>
                    <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[2]}}"></span>
                {{else}}
                    {{#if data.[1]}}
                        <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                        <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[1]}}"></span>
                    {{else}}
                        {{#if data.[0]}}
                            <span class='form-option-variant form-option-variant--color' title="{{this.label}}" style="background-color: #{{data.[0]}}"></span>
                        {{/if}}
                    {{/if}}
                {{/if}}
                {{#if pattern}}
                    <span class="form-option-expanded">
                        <span class="form-option-image" style="background-image: url('{{getImage image 'core-swatch'}}');"></span>
                    </span>
                {{/if}}
            </label>
            <span class="color-label">{{this.label}}</span>
        </div>
        {{/each}}
        </div>
        {{#if this.values.length '>' 5}}
            <span class="arrow right-arrow" id="right-arrow-{{id}}">&#8250;</span>
        {{/if}}
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const swatchGroups = document.querySelectorAll('.swatches-container');

        swatchGroups.forEach((swatchContainer) => {
            const swatchGroupId = swatchContainer.id.split('-')[2];
            const leftArrow = document.querySelector(`#left-arrow-${swatchGroupId}`);
            const rightArrow = document.querySelector(`#right-arrow-${swatchGroupId}`);
            const swatchNum = parseInt('{{this.values.length}}');

            if (!swatchContainer || !leftArrow || !rightArrow) return;

            const scrollAmount = 100;

            function toggleArrowVisibility() {
                const windowWidth = window.innerWidth;

                // Hide arrows if swatchNum is less than 7 and window width is greater than 450px
                if (swatchNum < 7 && windowWidth > 450) {
                    leftArrow.style.display = 'none';
                    rightArrow.style.display = 'none';
                } else {
                    leftArrow.style.display = 'block';
                    rightArrow.style.display = 'block';
                    updateArrowStyles();
                }
            }

            // Update arrow styles based on scroll position
            function updateArrowStyles() {
                if (swatchContainer.scrollLeft > 0) {
                    leftArrow.style.opacity = '1';
                    leftArrow.style.pointerEvents = 'auto';
                } else {
                    leftArrow.style.opacity = '0.2';
                    leftArrow.style.pointerEvents = 'none';
                }

                if (swatchContainer.scrollLeft < swatchContainer.scrollWidth - swatchContainer.clientWidth) {
                    rightArrow.style.opacity = '1';
                    rightArrow.style.pointerEvents = 'auto';
                } else {
                    rightArrow.style.opacity = '0.2';
                    rightArrow.style.pointerEvents = 'none';
                }
            }

            // Scroll left
            leftArrow.addEventListener('click', () => {
                swatchContainer.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                setTimeout(updateArrowStyles, 300);
            });

            // Scroll right
            rightArrow.addEventListener('click', () => {
                const maxScroll = swatchContainer.scrollWidth - swatchContainer.clientWidth;
                const remainingScroll = maxScroll - swatchContainer.scrollLeft;

                swatchContainer.scrollBy({
                    left: Math.min(scrollAmount, remainingScroll),
                    behavior: 'smooth',
                });
                setTimeout(updateArrowStyles, 300);
            });

            // Update arrow styles on load and on scroll
            window.addEventListener('load', () => {
                toggleArrowVisibility();
                updateArrowStyles();
            });

            window.addEventListener('resize', toggleArrowVisibility);
            swatchContainer.addEventListener('scroll', updateArrowStyles);
        });
    });
</script>
