<section class="productCarousel" data-list-name="{{list}}"
    data-slick='{
        "dots": true,
        "arrows": false,
        "mobileFirst": true,
        "infinite": false,
        "slidesToShow": 2,
        "slidesToScroll": 2,
        "nextArrow": "<svg class=&apos;slick-next slick-arrow&apos;><use xlink:href=&apos;#slick-arrow-next&apos;></use></svg>", 
        "prevArrow": "<svg class=&apos;slick-prev slick-arrow&apos;><use xlink:href=&apos;#slick-arrow-prev&apos;></use></svg>",
        "responsive": [
        {
            "breakpoint": 1025,
            "settings": {
                "slidesToScroll": {{columns}},
                "slidesToShow": {{columns}},
                "dots": {{dots}},
                "arrows": {{arrows}}
            }
        },
        {
            "breakpoint": 992,
            "settings": {
                "slidesToScroll": 4,
                "slidesToShow": 4
            }
        },
        {
            "breakpoint": 551,
            "settings": {
                "slidesToScroll": 3,
                "slidesToShow": 3
            }
        }
    ]}'>
    {{#each products}}
    <div class="productCarousel-slide">
        {{> components/products/card theme_settings=../theme_settings customer=../customer show_rating=../settings.show_product_rating show_wishlist=../settings.show_wishlist event="list" position=(add @index 1)}}
    </div>
    {{/each}}
</section>
