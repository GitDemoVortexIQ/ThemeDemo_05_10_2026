<div class="themevale_productsByCategory-products newproducts">
    <div class="productCarousel"
        data-slick='{
            "arrows": true,
            "dots": true,
            "infinite": false,
            "slidesToShow": 5,
            "slidesToScroll": 5,
            "adaptiveHeight": true,
            "nextArrow": "<svg class=&apos;slick-next slick-arrow&apos;><use xlink:href=&apos;#slick-arrow-next&apos;></use></svg>", 
            "prevArrow": "<svg class=&apos;slick-prev slick-arrow&apos;><use xlink:href=&apos;#slick-arrow-prev&apos;></use></svg>"
        }'>
        {{#each products}}
        <div class="productCarousel-slide">
            {{> components/products/card-new products=../products theme_settings=../theme_settings customer=../customer show_rating=../settings.show_product_rating show_wishlist=../settings.show_wishlist}}
        </div>
        {{/each}}
    </div>
</div>
